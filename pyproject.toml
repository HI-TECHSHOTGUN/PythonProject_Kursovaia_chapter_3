[tool.poetry]
name = "pythonproject-kursovaia-chapter-3"
version = "0.1.0"
description = ""
authors = ["HI-TECHSHOTGUN <maksimov_maksime@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
isort = "^6.0.0"
black = "^25.1.0"
flake8 = "^7.1.1"
pandas = "^2.2.3"
openpyxl = "^3.1.5"
requests = "^2.32.3"
websocket = "^0.2.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''